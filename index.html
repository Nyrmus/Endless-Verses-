<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Endless Verses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #f7f3ff;
      --mute: #b7a8d4;
      --line: rgba(210, 170, 255, .28);
      --violet: #b56bff;
      --deep: #6d2bff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh; color: var(--ink); font-family: Syne, sans-serif;
      background: #04030a; overflow-x: hidden;
    }
    .chroma {
      position: fixed; inset: -20%; pointer-events: none; z-index: 0;
      background:
        radial-gradient(40% 35% at 18% 8%, rgba(181,107,255,.45), transparent 58%),
        radial-gradient(32% 28% at 88% 0%, rgba(80,220,255,.16), transparent 55%),
        radial-gradient(28% 30% at 70% 80%, rgba(255,70,180,.12), transparent 60%);
      filter: blur(8px) saturate(1.4);
      animation: drift 18s ease-in-out infinite alternate;
    }
    @keyframes drift {
      from { transform: translate3d(-2%, -1%, 0) scale(1); }
      to { transform: translate3d(2%, 2%, 0) scale(1.06); }
    }
    .mesh {
      position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .22;
      background-image:
        linear-gradient(115deg, transparent 49%, rgba(255,255,255,.09) 50%, transparent 51%),
        linear-gradient(65deg, transparent 49%, rgba(181,107,255,.12) 50%, transparent 51%);
      background-size: 72px 72px, 46px 46px;
    }
    a { color: inherit; text-decoration: none; }
    .off { display: none !important; }
    .wrap { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 22px 22px 96px; }
    .glass {
      background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.02));
      border: 1px solid var(--line);
      box-shadow: 0 20px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.18);
      backdrop-filter: blur(22px) saturate(1.35);
    }
    .nav {
      display: flex; justify-content: space-between; align-items: center;
      gap: 16px; padding: 12px 16px 12px 22px; border-radius: 999px; position: relative;
    }
    .logo { font-weight: 700; letter-spacing: .28em; font-size: 11px; }
    .nav nav { display: flex; gap: 22px; color: var(--mute); font-size: 14px; }
    .account-wrap { position: static; z-index: 30; }
    #accountToggle {
      background: rgba(181,107,255,.12); color: #fff; border: 1px solid var(--line);
      padding: 9px 14px; border-radius: 999px; cursor: pointer; font: inherit;
    }
    #accountToggle:hover { box-shadow: 0 0 22px rgba(181,107,255,.55); }
    #accountPanel {
      position: fixed; right: 20px; top: 78px;
      width: 320px; padding: 18px; border-radius: 22px; z-index: 80;
      pointer-events: auto;
    }
    #accountPanel .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    #accountPanel .tabs button {
      flex: 1; background: rgba(255,255,255,.04); color: #f4edff;
      border: 1px solid var(--line); padding: 9px 0; border-radius: 999px;
      cursor: pointer; font: inherit;
    }
    #accountPanel .tabs button.active {
      background: rgba(181,107,255,.25); box-shadow: 0 0 16px rgba(181,107,255,.25);
    }
    #accountPanel form { display: flex; flex-direction: column; gap: 14px; }
    #accountPanel label {
      display: flex; flex-direction: column; gap: 8px;
      font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute);
    }
    #accountPanel input {
      height: 46px; width: 100%;
      background: #0b0914; color: #fff;
      border: 1px solid rgba(214,186,255,.32);
      border-radius: 12px; padding: 0 14px;
      font: 16px/1 Syne, sans-serif;
      outline: none; appearance: none; -webkit-appearance: none;
    }
    #accountPanel input:hover { border-color: rgba(214,186,255,.55); }
    #accountPanel input:focus {
      border-color: #c9a6ff;
      box-shadow: 0 0 0 3px rgba(181,107,255,.28);
    }
    #accountPanel .btn { width: 100%; margin-top: 2px; }
    .hero { padding: 90px 0 28px; text-align: center; }
    .hero h1 {
      font-family: "Instrument Serif", serif; font-weight: 400;
      font-size: clamp(52px, 11vw, 104px); letter-spacing: -.03em; line-height: .88;
      background: linear-gradient(180deg, #fff 20%, #c9a6ff 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 40px rgba(181,107,255,.35));
    }
    .row { display: flex; gap: 10px; justify-content: center; margin-top: 34px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 13px 22px; border-radius: 999px; border: 0;
      background: linear-gradient(180deg, #e0c2ff, var(--violet) 40%, var(--deep));
      color: #14081f; cursor: pointer; font: inherit; font-weight: 700;
      box-shadow: 0 0 0 1px rgba(255,255,255,.2), 0 12px 40px rgba(109,43,255,.45);
      transition: box-shadow .2s ease, filter .2s ease;
    }
    .btn:hover { box-shadow: 0 0 28px rgba(181,107,255,.7); filter: brightness(1.08); }
    .btn.locked { filter: grayscale(.15); opacity: .7; }
    .stars { display: flex; gap: 10px; justify-content: center; margin-top: 28px; }
    .stars button {
      width: 38px; height: 38px; border: 1px solid var(--line);
      background: rgba(255,255,255,.04); color: #e3c9ff; cursor: pointer;
      clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
    }
    .stars button:hover { box-shadow: 0 0 18px rgba(181,107,255,.6); }
    #rateAvg { margin-top: 12px; color: var(--mute); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
    section { padding: 56px 0 10px; }
    h2 { font-family: "Instrument Serif", serif; font-weight: 400; font-size: 34px; margin-bottom: 22px; }
    .socials { display: flex; justify-content: center; gap: 42px; flex-wrap: wrap; padding: 20px 0; }
    .spin-wrap { width: 170px; height: 170px; animation: spinY 7s linear infinite; transform-style: preserve-3d; }
    .spin-wrap:nth-child(2) { animation-duration: 8.2s; animation-direction: reverse; }
    .spin-wrap:nth-child(3) { animation-duration: 6.4s; }
    @keyframes spinY {
      from { transform: rotateZ(-2deg) rotateY(0); }
      to { transform: rotateZ(-2deg) rotateY(360deg); }
    }
    .diamond {
      width: 170px; height: 170px;
      clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
      display: flex; align-items: center; justify-content: center;
    }
    .diamond:hover { box-shadow: 0 0 40px rgba(181,107,255,.75); }
    .diamond-inner { text-align: center; animation: counter 7s linear infinite; }
    .spin-wrap:nth-child(2) .diamond-inner { animation-duration: 8.2s; animation-direction: reverse; }
    .spin-wrap:nth-child(3) .diamond-inner { animation-duration: 6.4s; }
    @keyframes counter {
      from { transform: rotateY(0); }
      to { transform: rotateY(-360deg); }
    }
    .diamond .tag { display: block; color: #d7b8ff; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; }
    .slot-wrap { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
    #slot { display: flex; gap: 10px; padding: 18px; border-radius: 24px; }
    .reel {
      width: 72px; height: 88px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; background: rgba(0,0,0,.35); border: 1px solid var(--line);
    }
    #slot.jackpot { animation: boom .6s ease 3; box-shadow: 0 0 50px #ff4fd8, 0 0 90px #7b3dff; }
    @keyframes boom {
      0%,100% { transform: scale(1) rotate(0); }
      30% { transform: scale(1.06) rotate(-2deg); }
      60% { transform: scale(1.08) rotate(2deg); }
    }
    .slot-side { display: flex; flex-direction: column; gap: 10px; min-width: 220px; }
    .tokens { letter-spacing: .12em; text-transform: uppercase; color: #d7b8ff; }
    .box { max-width: 560px; padding: 20px; border-radius: 26px; }
    .cmt-actions button, #logoutBtn {
      background: rgba(255,255,255,.05); color: #f4edff; border: 1px solid var(--line);
      padding: 7px 11px; border-radius: 999px; cursor: pointer; font: inherit;
    }
    form { display: flex; flex-direction: column; gap: 10px; }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--mute); }
    input, textarea {
      background: #0b0914; color: #fff; border: 1px solid var(--line);
      padding: 11px 12px; border-radius: 14px; font: inherit; width: 100%;
      outline: none;
    }
    input:focus, textarea:focus {
      border-color: #c9a6ff;
      box-shadow: 0 0 0 3px rgba(181,107,255,.25);
    }
    textarea { min-height: 88px; resize: vertical; }
    .msg, #commentErr { color: #ff9ad8; min-height: 1.2em; }
    .muted { color: var(--mute); }
    .cmt { margin: 12px 0; padding: 16px; border-radius: 20px; }
    .cmt.pinned { box-shadow: 0 0 0 1px #c9a6ff, 0 0 28px rgba(181,107,255,.2); }
    .cmt header { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
    .owner-badge {
      font-size: 10px; letter-spacing: .2em; padding: 4px 8px; border-radius: 999px;
      color: #fff; background: linear-gradient(90deg, #9b5cff, #6d2bff);
      box-shadow: 0 0 18px rgba(150,80,255,.9);
    }
    .cmt-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .thread { margin: 10px 0 0 14px; }
    .thread summary { cursor: pointer; color: #c9a6ff; }
    .note { padding: 10px 12px; margin-bottom: 8px; border-radius: 14px; background: rgba(123,61,255,.22); }
    footer { padding-top: 48px; color: #7d738c; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="chroma"></div>
  <div class="mesh"></div>
  <div class="wrap" id="top">
    <header class="nav glass">
      <a class="logo" href="index.html">ENDLESS VERSES</a>
      <nav>
        <a href="#socials">Socials</a>
        <a href="#slot-sec">Automat</a>
        <a href="#comments-sec">Kommentare</a>
      </nav>
      <div class="account-wrap">
        <button type="button" id="accountToggle"><span id="session">Konto</span></button>
        <div id="accountPanel" class="glass" hidden>
          <div class="tabs">
            <button type="button" id="tabLogin" class="active">Login</button>
            <button type="button" id="tabRegister">Registrieren</button>
          </div>
          <form id="loginForm">
            <label>Name <input id="loginName" autocomplete="username"></label>
            <label>Passwort <input id="loginPass" type="password" autocomplete="current-password"></label>
            <button class="btn" type="submit">Einloggen</button>
          </form>
          <form id="registerForm" class="off">
            <label>Name <input id="regName" autocomplete="username"></label>
            <label>Passwort <input id="regPass" type="password" autocomplete="new-password"></label>
            <button class="btn" type="submit">Account erstellen</button>
          </form>
          <p id="msg" class="msg"></p>
          <button type="button" id="logoutBtn" hidden>Logout</button>
        </div>
      </div>
    </header>

    <div class="hero">
      <h1>Endless<br>Verses</h1>
      <div class="row">
        <a id="playBtn" class="btn locked" href="#top">Ins Spiel</a>
      </div>
      <div class="stars" aria-label="Bewerten">
        <button type="button" data-star="1">1</button>
        <button type="button" data-star="2">2</button>
        <button type="button" data-star="3">3</button>
        <button type="button" data-star="4">4</button>
        <button type="button" data-star="5">5</button>
      </div>
      <p id="rateAvg">Noch keine Bewertung</p>
    </div>

    <section id="socials">
      <h2>Socials</h2>
      <div class="socials">
        <a class="spin-wrap" href="https://x.com/Nyrmus8" target="_blank" rel="noopener"><span class="diamond glass"><span class="diamond-inner"><span class="tag">X</span>Nyrmus8</span></span></a>
        <a class="spin-wrap" href="https://www.tiktok.com/@nyrmus" target="_blank" rel="noopener"><span class="diamond glass"><span class="diamond-inner"><span class="tag">TikTok</span>nyrmus</span></span></a>
        <a class="spin-wrap" href="https://www.reddit.com/user/Jolly_Dot_2995/" target="_blank" rel="noopener"><span class="diamond glass"><span class="diamond-inner"><span class="tag">Reddit</span>Nyrmus</span></span></a>
      </div>
    </section>

    <section id="slot-sec">
      <h2>Community-Automat</h2>
      <div class="slot-wrap">
        <div id="slot" class="glass">
          <div class="reel" id="r1">7</div>
          <div class="reel" id="r2">♥</div>
          <div class="reel" id="r3">◆</div>
        </div>
        <div class="slot-side">
          <p class="tokens">Tokens · <span id="tokens">100</span></p>
          <label>Einsatz <input id="bet" type="number" min="1" value="1"></label>
          <button class="btn" type="button" id="spinBtn">Spin</button>
          <p id="slotJoke" class="muted">Just for fun. Gewinne sind wertlos.</p>
        </div>
      </div>
    </section>

    <section id="inbox-sec">
      <h2>Ideen-Inbox · <span id="inboxCount">0</span></h2>
      <form id="ideaForm" class="box glass">
        <label>Idee <textarea id="ideaText" required></textarea></label>
        <button class="btn" type="submit">Senden</button>
      </form>
      <div id="inbox" class="box glass" style="margin-top:12px"></div>
    </section>

    <section id="comments-sec">
      <h2>Kommentare</h2>
      <div id="notifs"></div>
      <form id="commentForm" class="box glass">
        <label>Kommentar <textarea id="commentText" required></textarea></label>
        <button class="btn" type="submit">Posten</button>
        <p id="commentErr"></p>
      </form>
      <div id="comments"></div>
    </section>
    <footer>Endless Verses</footer>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/home.js"></script>
  <script src="js/community.js"></script>
  <script src="js/slot.js"></script>
</body>
</html>
