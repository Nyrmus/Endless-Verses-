<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Endless Verses — Play</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Syne:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { margin: 0; background: #04030a; font-family: Syne, sans-serif; color: #f4edff; }
    #wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; }
    #wrap header h1 { font-family: "Instrument Serif", serif; letter-spacing: .08em; font-weight: 400; }
    #menuBtn {
      position: fixed; top: 18px; right: 18px; z-index: 5;
      border: 1px solid rgba(214,186,255,.35); background: rgba(20,12,36,.7);
      color: #fff; padding: 10px 16px; border-radius: 999px; cursor: pointer; font: inherit;
    }
    #menu {
      position: fixed; inset: 0; z-index: 10;
      display: none; align-items: center; justify-content: center;
      background: rgba(4,3,10,.78);
    }
    #menu.on { display: flex; }
    #menuCard {
      width: min(360px, 92vw); padding: 28px 24px; border-radius: 24px;
      background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.02));
      border: 1px solid rgba(214,186,255,.3);
      text-align: center;
    }
    #menuCard h2 { font-family: "Instrument Serif", serif; font-weight: 400; font-size: 36px; margin: 0 0 8px; }
    #menuCard p { color: #b7a8d4; margin: 0 0 18px; }
    #menuCard button, #menuCard a {
      display: block; width: 100%; margin: 8px 0; padding: 12px 14px;
      border-radius: 999px; border: 1px solid rgba(214,186,255,.35);
      background: rgba(255,255,255,.04); color: #f4edff; font: inherit; cursor: pointer; text-decoration: none;
    }
    #menuCard button.primary {
      background: linear-gradient(180deg, #e0c2ff, #b56bff 40%, #6d2bff);
      color: #14081f; border: 0; font-weight: 700;
    }
    #menuCard button:hover, #menuCard a:hover { box-shadow: 0 0 22px rgba(181,107,255,.45); }
  </style>
</head>
<body>
  <button type="button" id="menuBtn">Menü</button>
  <div id="wrap">
    <header>
      <h1>ENDLESS VERSES</h1>
      <p id="verseName">Hub</p>
    </header>
    <canvas id="game" width="960" height="540"></canvas>
    <footer>ESC Menü · A/D laufen · Leertaste springen</footer>
  </div>
  <div id="menu">
    <div id="menuCard">
      <h2>Menü</h2>
      <p id="menuWho"></p>
      <button type="button" class="primary" id="resumeBtn">Weiter</button>
      <button type="button" id="verseHub">Vers: Hub</button>
      <button type="button" id="verseSoul">Vers: Soul</button>
      <button type="button" id="saveBtn">Speichern</button>
      <a href="index.html">Website</a>
      <button type="button" id="logoutPlay">Logout</button>
    </div>
  </div>
  <script src="js/auth.js"></script>
  <script>
    if (!EVAuth.current()) location.href = "index.html";
    else document.getElementById("menuWho").textContent = EVAuth.current().name;
  </script>
  <script src="js/verses/hub.js"></script>
  <script src="js/verses/soul.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
