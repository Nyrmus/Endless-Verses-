<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Endless Verses</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #12100e;
      color: #f4e6c3;
      font-family: "Courier New", monospace;
    }
    #who { position: fixed; top: 12px; right: 16px; font-size: 12px; letter-spacing: .12em; z-index: 5; color: #ffcf5a; }
    #lobby.off { display: none; }
    #play { display: none; min-height: 100vh; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: #12100e; }
    #play.on { display: flex; }
    #lobby {
      display: grid;
      grid-template-columns: 210px 1fr 250px;
      min-height: 100vh;
      background: radial-gradient(60% 50% at 50% 40%, #3a2a1c, #16120e);
    }
    .col { padding: 28px 18px; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
    .col.side button, .col.side a {
      background: #3a2a1c; color: #f4e6c3; border: 3px solid #6a4a28;
      padding: 10px; font: 700 14px "Courier New", monospace; cursor: pointer; text-align: left; text-decoration: none;
    }
    .col.side button:hover, .col.side a:hover { border-color: #ffcf5a; color: #ffcf5a; }
    .stage { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
    .hero-name {
      font-size: 34px; letter-spacing: .14em; color: #ffcf5a;
      text-shadow: 4px 4px 0 #4a2a08, 0 0 18px rgba(255,180,40,.45);
    }
    #startBtn {
      background: linear-gradient(#ffd36a, #e09018);
      color: #2a1604; border: 4px solid #7a4a08;
      padding: 14px 36px; font: 800 24px "Courier New", monospace; cursor: pointer;
      letter-spacing: .16em;
    }
    #dollStats { list-style: none; font-size: 12px; }
    #dollStats li { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 2px solid #3a2a1c; }
    #locker {
      display: none; position: fixed; inset: 0; z-index: 8; background: #12100e; padding: 48px 24px 24px;
    }
    #locker.on { display: grid; grid-template-columns: 260px 1fr; gap: 16px; }
    #closeLocker, .slot, .item, #hud button {
      background: #3a2a1c; color: #f4e6c3; border: 3px solid #6a4a28;
      padding: 10px; font: 700 13px "Courier New", monospace; cursor: pointer;
    }
    #closeLocker { position: absolute; top: 12px; right: 16px; }
    .slot, .item { display: block; width: 100%; text-align: left; margin: 0 0 8px; }
    .slot.on, .item.on { border-color: #ffcf5a; }
    .slot small, .item small { display: block; color: #c4a06a; font-size: 10px; }
    canvas {
      width: min(1120px, 96vw);
      height: auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 6px solid #6a4a28;
      box-shadow: 0 0 40px rgba(255,170,40,.12), 0 20px 50px rgba(0,0,0,.55);
      background: #1e1c1a;
    }
    #hud { width: min(1120px,96vw); display: flex; justify-content: space-between; align-items: center; }
    #lootHud { color: #ffcf5a; font-weight: 800; letter-spacing: .12em; }
  </style>
</head>
<body>
  <div id="who"></div>
  <div id="lobby">
    <div class="col side">
      <button type="button" id="startSide">Spielen</button>
      <button type="button" id="openLocker">Ausrüstung</button>
      <button type="button" id="pickHub">Hub</button>
      <button type="button" id="pickSoul">Soul</button>
      <a href="index.html">Website</a>
      <button type="button" id="logoutPlay">Logout</button>
    </div>
    <div class="stage">
      <div class="hero-name">LOOT SAVINGS</div>
      <button type="button" id="startBtn">SPIELEN</button>
    </div>
    <div class="col right">
      <ul id="dollStats"></ul>
    </div>
  </div>
  <div id="locker">
    <button type="button" id="closeLocker">Zurück</button>
    <div id="slots"></div>
    <div id="items"></div>
  </div>
  <div id="play">
    <div id="hud">
      <span id="verseName">Steingang</span>
      <span id="lootHud">GOLD 0</span>
      <button type="button" id="toMenu">Hauptmenü</button>
    </div>
    <canvas id="game" width="480" height="270"></canvas>
    <p style="font-size:12px;color:#c4a06a">A/D laufen · E oder Klick öffnet die Truhe</p>
  </div>
  <script src="js/auth.js"></script>
  <script>
    if (!EVAuth.current()) location.href = "index.html";
    else document.getElementById("who").textContent = EVAuth.current().name;
  </script>
  <script src="js/verses/hub.js"></script>
  <script src="js/verses/soul.js"></script>
  <script src="js/loadout.js"></script>
  <script src="js/game.js"></script>
  <script src="js/lobby.js"></script>
</body>
</html>
